<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全职法师 - 魔法觉醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        button {
            font-family: inherit;
        }
        /* 消息弹窗显示时禁用行动按钮，防止点击穿透 */
        body.message-showing .action-button {
            pointer-events: none !important;
            opacity: 0.7;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #555588;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7777aa;
        }

        /* 粒子浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.9; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-30px) translateX(5px); opacity: 0.8; }
        }

        /* ========== 手机端适配（仅屏幕宽度 < 768px 时生效，PC端不受影响） ========== */
        @media (max-width: 768px) {
            .mobile-main-content {
                flex-direction: column !important;
            }
            .mobile-action-panel {
                flex: none !important;
                width: 100% !important;
                padding: 15px !important;
                overflow-y: visible !important;
            }
            .mobile-side-menu {
                width: 100% !important;
                border-left: none !important;
                border-top: 2px solid #444477 !important;
                padding: 15px !important;
            }
            .mobile-top-bar {
                flex-wrap: wrap !important;
                gap: 8px !important;
                padding: 10px 15px !important;
            }
            .mobile-top-bar > div:first-child {
                gap: 10px !important;
                flex-wrap: wrap !important;
            }
            .mobile-top-bar > div:last-child {
                gap: 12px !important;
                flex-wrap: wrap !important;
                font-size: 13px !important;
            }
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px !important;
            }
            .mobile-popup {
                max-width: 92vw !important;
                width: 92vw !important;
                min-width: auto !important;
            }
            .mobile-btn {
                padding: 14px 18px !important;
                font-size: 15px !important;
            }
            .mobile-title h1 {
                font-size: 32px !important;
            }
            .mobile-title .subtitle {
                font-size: 14px !important;
            }
            .mobile-battle-container {
                padding: 15px !important;
            }
            body {
                overflow-x: hidden;
            }
        }
        @media (max-width: 480px) {
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- 游戏数据（已拆分为多个模块） -->
    <script src="engine/data/skills.js"></script>
    <script src="engine/data/characters.js"></script>
    <script src="engine/data/locations.js"></script>
    <script src="engine/data/items.js"></script>
    <script src="engine/data/quests.js"></script>
    <script src="engine/data/events.js"></script>
    <script src="engine/data/shops.js"></script>
    <script src="engine/data/enemies.js"></script>
    <script src="engine/data/world.js"></script>
    <script src="engine/data/big-events.js"></script>
    <script src="engine/data/talents.js"></script>
    <script src="engine/data/index.js"></script>

    <!-- 游戏引擎 -->
    <script src="engine/data.js"></script>
    <script src="engine/skill.js"></script>
    <script src="engine/inventory.js"></script>
    <script src="engine/talent.js"></script>
    <script src="engine/player.js"></script>
    <script src="engine/time.js"></script>
    <script src="engine/quest.js"></script>
    <script src="engine/daily.js"></script>
    <script src="engine/event.js"></script>
    <script src="engine/big-event.js"></script>
    <script src="engine/shop.js"></script>
    <script src="engine/map.js"></script>
    <script src="engine/battle.js"></script>
    <script src="engine/world-state.js"></script>
    <script src="engine/npc-state.js"></script>
    <script src="engine/dialogue-tree.js"></script>
    <script src="engine/ui.js"></script>
    <script src="engine/game.js"></script>

    <!-- 全局错误捕获 -->
    <div id="debug-error" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ff0000;
        color: #fff;
        padding: 10px;
        font-size: 14px;
        z-index: 999999;
        display: none;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
    "></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent = '错误: ' + msg + '\n位置: ' + url + ':' + line + ':' + col +
                    (error && error.stack ? '\n堆栈: ' + error.stack : '');
            }
            console.error('全局错误:', msg, url, line, col, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent += '\nPromise错误: ' + (event.reason && event.reason.message ? event.reason.message : event.reason);
            }
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
</html>
