<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全职法师 - 魔法觉醒</title>
    <style>
        /* ========== v3.3.0 美术资源管理体系 ========== */
        /* 11系魔法主题色系 */
        :root {
            --fire-primary: #ff4400;
            --fire-secondary: #ff8800;
            --fire-glow: #ffaa00;
            --ice-primary: #00aaff;
            --ice-secondary: #88ddff;
            --ice-glow: #aaeeff;
            --thunder-primary: #aa00ff;
            --thunder-secondary: #cc44ff;
            --thunder-glow: #dd88ff;
            --water-primary: #0066ff;
            --water-secondary: #4488ff;
            --water-glow: #66aaff;
            --wind-primary: #00ff88;
            --wind-secondary: #44ffaa;
            --wind-glow: #88ffcc;
            --earth-primary: #aa8800;
            --earth-secondary: #ccaa44;
            --earth-glow: #ddcc88;
            --light-primary: #ffdd00;
            --light-secondary: #ffee88;
            --light-glow: #ffffaa;
            --dark-primary: #660066;
            --dark-secondary: #880088;
            --dark-glow: #aa44aa;
            --summon-primary: #00aaaa;
            --summon-secondary: #44cccc;
            --summon-glow: #88dddd;
            --space-primary: #8800aa;
            --space-secondary: #aa44cc;
            --space-glow: #cc88ee;
            --chaos-primary: #444444;
            --chaos-secondary: #666666;
            --chaos-glow: #888888;
        }

        /* 11系魔法渐变背景类（图片缺失时的占位） */
        .bg-fire { background: linear-gradient(135deg, #1a0500 0%, #3d1500 30%, #662200 60%, #1a0500 100%); }
        .bg-ice { background: linear-gradient(135deg, #001a2e 0%, #003355 30%, #005588 60%, #001a2e 100%); }
        .bg-thunder { background: linear-gradient(135deg, #1a002e 0%, #330055 30%, #550088 60%, #1a002e 100%); }
        .bg-water { background: linear-gradient(135deg, #000d2e 0%, #001a55 30%, #002288 60%, #000d2e 100%); }
        .bg-wind { background: linear-gradient(135deg, #002e1a 0%, #005533 30%, #008855 60%, #002e1a 100%); }
        .bg-earth { background: linear-gradient(135deg, #2e2200 0%, #554400 30%, #886600 60%, #2e2200 100%); }
        .bg-light { background: linear-gradient(135deg, #2e2800 0%, #554a00 30%, #887700 60%, #2e2800 100%); }
        .bg-dark { background: linear-gradient(135deg, #1a001a 0%, #2e002e 30%, #440044 60%, #1a001a 100%); }
        .bg-summon { background: linear-gradient(135deg, #002e2e 0%, #005555 30%, #008888 60%, #002e2e 100%); }
        .bg-space { background: linear-gradient(135deg, #1a002e 0%, #2e0055 30%, #440088 60%, #1a002e 100%); }
        .bg-chaos { background: linear-gradient(135deg, #1a1a1a 0%, #2e2e2e 30%, #444444 60%, #1a1a1a 100%); }
        .bg-bocity { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 30%, #2a2a6a 60%, #0a0a2a 100%); }
        .bg-xuefeng { background: linear-gradient(135deg, #0a1a2a 0%, #1a3a5a 30%, #2a5a8a 60%, #0a1a2a 100%); }

        /* 魔法粒子纹理叠加 */
        .magic-texture {
            position: relative;
        }
        .magic-texture::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.01) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ========== 基础CSS动画 ========== */
        /* 按钮悬浮效果 */
        .btn-hover {
            transition: all 0.2s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 150, 255, 0.3);
        }
        .btn-hover:active {
            transform: translateY(0);
        }

        /* 面板入场动画 */
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .panel-in {
            animation: panelIn 0.3s ease-out forwards;
        }

        /* 面板出场动画 */
        @keyframes panelOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.98); }
        }
        .panel-out {
            animation: panelOut 0.2s ease-in forwards;
        }

        /* 伤害数字浮动 */
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
        }
        .damage-number {
            animation: damageFloat 1.2s ease-out forwards;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor, 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* 元素脉冲发光 */
        @keyframes elementPulse {
            0%, 100% { box-shadow: 0 0 5px var(--element-glow, rgba(100,150,255,0.5)); }
            50% { box-shadow: 0 0 20px var(--element-glow, rgba(100,150,255,0.8)), 0 0 30px var(--element-glow, rgba(100,150,255,0.3)); }
        }
        .element-pulse {
            animation: elementPulse 2s ease-in-out infinite;
        }

        /* 受击抖动 */
        @keyframes hitShake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(8px); }
            30% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            70% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
        }
        .hit-shake {
            animation: hitShake 0.4s ease-in-out;
        }

        /* 受击闪光 */
        @keyframes hitFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) saturate(0.5); }
        }
        .hit-flash {
            animation: hitFlash 0.3s ease-in-out;
        }

        /* 技能冷却旋转 */
        @keyframes cooldownRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 淡入 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 滑入（从左） */
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-in-left {
            animation: slideInLeft 0.3s ease-out forwards;
        }

        /* 滑入（从右） */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-in-right {
            animation: slideInRight 0.3s ease-out forwards;
        }

        /* 呼吸动画 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .breathe {
            animation: breathe 3s ease-in-out infinite;
        }

        /* 新内容提示闪烁 */
        @keyframes newContentGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 100, 0.5); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 100, 0.8), 0 0 25px rgba(0, 255, 100, 0.4); }
        }
        .new-content {
            animation: newContentGlow 1.5s ease-in-out infinite;
        }

        /* NPC头像占位样式 */
        .npc-avatar-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(100,100,150,0.3), rgba(50,50,100,0.5));
            border: 2px solid rgba(150,150,200,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }
        #game-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
        }
        /* 消息弹窗显示时禁用行动按钮，防止点击穿透 */
        body.message-showing .action-button {
            pointer-events: none !important;
            opacity: 0.7;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #555588;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7777aa;
        }

        /* 粒子浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.9; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-30px) translateX(5px); opacity: 0.8; }
        }

        /* v2.9.0: 打断红色闪烁动画 */
        @keyframes flashRed {
            0% { opacity: 0.6; }
            50% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        /* v2.9.0: 施法脉冲动画 */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255,100,100,0.5); }
            50% { box-shadow: 0 0 25px rgba(255,200,100,0.8); }
        }

        /* v2.9.1: 高阶魔法释放全屏特效 */
        @keyframes highTierFlash {
            0% { opacity: 0; }
            10% { opacity: 0.8; }
            30% { opacity: 0.4; }
            50% { opacity: 0.6; }
            100% { opacity: 0; }
        }
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-8px, -4px); }
            20% { transform: translate(8px, 4px); }
            30% { transform: translate(-6px, 6px); }
            40% { transform: translate(6px, -6px); }
            50% { transform: translate(-4px, 2px); }
            60% { transform: translate(4px, -2px); }
            70% { transform: translate(-2px, 4px); }
            80% { transform: translate(2px, -4px); }
            90% { transform: translate(-1px, 1px); }
        }
        @keyframes magicBurst {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.2); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .high-tier-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            animation: highTierFlash 1.2s ease-out forwards;
        }
        .screen-shake {
            animation: screenShake 0.6s ease-in-out;
        }
        .magic-burst {
            position: fixed; top: 50%; left: 50%;
            width: 200px; height: 200px; margin: -100px 0 0 -100px;
            border-radius: 50%; pointer-events: none; z-index: 9998;
            animation: magicBurst 0.8s ease-out forwards;
        }

        /* ========== 手机端适配（仅屏幕宽度 < 768px 时生效，PC端不受影响） ========== */
        @media (max-width: 768px) {
            .mobile-main-content {
                flex-direction: column !important;
            }
            .mobile-action-panel {
                flex: none !important;
                width: 100% !important;
                padding: 15px !important;
                overflow-y: visible !important;
            }
            .mobile-side-menu {
                width: 100% !important;
                border-left: none !important;
                border-top: 2px solid #444477 !important;
                padding: 15px !important;
            }
            .mobile-top-bar {
                flex-wrap: wrap !important;
                gap: 8px !important;
                padding: 10px 15px !important;
            }
            .mobile-top-bar > div:first-child {
                gap: 10px !important;
                flex-wrap: wrap !important;
            }
            .mobile-top-bar > div:last-child {
                gap: 12px !important;
                flex-wrap: wrap !important;
                font-size: 13px !important;
            }
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px !important;
            }
            .mobile-popup {
                max-width: 92vw !important;
                width: 92vw !important;
                min-width: auto !important;
            }
            .mobile-btn {
                padding: 14px 18px !important;
                font-size: 15px !important;
            }
            .mobile-title h1 {
                font-size: 32px !important;
            }
            .mobile-title .subtitle {
                font-size: 14px !important;
            }
            .mobile-battle-container {
                padding: 15px !important;
            }
            body {
                overflow-x: hidden;
            }
        }
        @media (max-width: 480px) {
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        /* 加载提示 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            color: #aaccff;
            font-size: 18px;
        }
        #loading-screen .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333366;
            border-top-color: #6688cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>







  <script src="./assets/index-D3ZlnQCh.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>正在加载魔法世界...</div>
    </div>
    <div id="game-container"></div>

    <!-- 模块化入口 -->


    <!-- 全局错误捕获 -->
    <div id="debug-error" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ff0000;
        color: #fff;
        padding: 10px;
        font-size: 14px;
        z-index: 999999;
        display: none;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
    "></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent = '错误: ' + msg + '\n位置: ' + url + ':' + line + ':' + col +
                    (error && error.stack ? '\n堆栈: ' + error.stack : '');
            }
            console.error('全局错误:', msg, url, line, col, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.textContent += '\nPromise错误: ' + (event.reason && event.reason.message ? event.reason.message : event.reason);
                debugDiv.style.display = 'block';
            }
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
