<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全职法师 - 魔法觉醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        button {
            font-family: inherit;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #555588;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7777aa;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="test-output" style="color: white; padding: 20px;">加载中...</div>

    <!-- 游戏数据 -->
    <script src="engine/game-data.js"></script>
    
    <!-- 游戏引擎 -->
    <script src="engine/data.js"></script>
    <script src="engine/skill.js"></script>
    <script src="engine/inventory.js"></script>
    <script src="engine/player.js"></script>
    <script src="engine/time.js"></script>
    <script src="engine/quest.js"></script>
    <script src="engine/event.js"></script>
    <script src="engine/shop.js"></script>
    <script src="engine/map.js"></script>
    <script src="engine/battle.js"></script>
    <script src="engine/world-state.js"></script>
    <script src="engine/npc-state.js"></script>
    <script src="engine/dialogue-tree.js"></script>
    <script src="engine/ui.js"></script>
    <script src="engine/game.js"></script>
</body>
</html>
