<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全职法师 - 魔法觉醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        button {
            font-family: inherit;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #555588;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7777aa;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- 游戏数据 -->
    <script src="engine/game-data.js"></script>
    
    <!-- 游戏引擎 -->
    <script src="engine/data.js"></script>
    <script src="engine/skill.js"></script>
    <script src="engine/inventory.js"></script>
    <script src="engine/player.js"></script>
    <script src="engine/time.js"></script>
    <script src="engine/quest.js"></script>
    <script src="engine/event.js"></script>
    <script src="engine/shop.js"></script>
    <script src="engine/map.js"></script>
    <script src="engine/battle.js"></script>
    <script src="engine/world-state.js"></script>
    <script src="engine/npc-state.js"></script>
    <script src="engine/dialogue-tree.js"></script>
    <script src="engine/ui.js"></script>
    <script src="engine/game.js"></script>
    
    <!-- 全局错误捕获 -->
    <div id="debug-error" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ff0000;
        color: #fff;
        padding: 10px;
        font-size: 14px;
        z-index: 999999;
        display: none;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
    "></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent = '错误: ' + msg + '\n位置: ' + url + ':' + line + ':' + col + 
                    (error && error.stack ? '\n堆栈: ' + error.stack : '');
            }
            console.error('全局错误:', msg, url, line, col, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent += '\nPromise错误: ' + (event.reason && event.reason.message ? event.reason.message : event.reason);
            }
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
</html>
