<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全职法师 - 魔法觉醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }
        #game-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
        }
        /* 消息弹窗显示时禁用行动按钮，防止点击穿透 */
        body.message-showing .action-button {
            pointer-events: none !important;
            opacity: 0.7;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #555588;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7777aa;
        }

        /* 粒子浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.9; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-30px) translateX(5px); opacity: 0.8; }
        }

        /* v2.9.0: 打断红色闪烁动画 */
        @keyframes flashRed {
            0% { opacity: 0.6; }
            50% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        /* v2.9.0: 施法脉冲动画 */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255,100,100,0.5); }
            50% { box-shadow: 0 0 25px rgba(255,200,100,0.8); }
        }

        /* v2.9.1: 高阶魔法释放全屏特效 */
        @keyframes highTierFlash {
            0% { opacity: 0; }
            10% { opacity: 0.8; }
            30% { opacity: 0.4; }
            50% { opacity: 0.6; }
            100% { opacity: 0; }
        }
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-8px, -4px); }
            20% { transform: translate(8px, 4px); }
            30% { transform: translate(-6px, 6px); }
            40% { transform: translate(6px, -6px); }
            50% { transform: translate(-4px, 2px); }
            60% { transform: translate(4px, -2px); }
            70% { transform: translate(-2px, 4px); }
            80% { transform: translate(2px, -4px); }
            90% { transform: translate(-1px, 1px); }
        }
        @keyframes magicBurst {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.2); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .high-tier-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            animation: highTierFlash 1.2s ease-out forwards;
        }
        .screen-shake {
            animation: screenShake 0.6s ease-in-out;
        }
        .magic-burst {
            position: fixed; top: 50%; left: 50%;
            width: 200px; height: 200px; margin: -100px 0 0 -100px;
            border-radius: 50%; pointer-events: none; z-index: 9998;
            animation: magicBurst 0.8s ease-out forwards;
        }

        /* ========== 手机端适配（仅屏幕宽度 < 768px 时生效，PC端不受影响） ========== */
        @media (max-width: 768px) {
            .mobile-main-content {
                flex-direction: column !important;
            }
            .mobile-action-panel {
                flex: none !important;
                width: 100% !important;
                padding: 15px !important;
                overflow-y: visible !important;
            }
            .mobile-side-menu {
                width: 100% !important;
                border-left: none !important;
                border-top: 2px solid #444477 !important;
                padding: 15px !important;
            }
            .mobile-top-bar {
                flex-wrap: wrap !important;
                gap: 8px !important;
                padding: 10px 15px !important;
            }
            .mobile-top-bar > div:first-child {
                gap: 10px !important;
                flex-wrap: wrap !important;
            }
            .mobile-top-bar > div:last-child {
                gap: 12px !important;
                flex-wrap: wrap !important;
                font-size: 13px !important;
            }
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px !important;
            }
            .mobile-popup {
                max-width: 92vw !important;
                width: 92vw !important;
                min-width: auto !important;
            }
            .mobile-btn {
                padding: 14px 18px !important;
                font-size: 15px !important;
            }
            .mobile-title h1 {
                font-size: 32px !important;
            }
            .mobile-title .subtitle {
                font-size: 14px !important;
            }
            .mobile-battle-container {
                padding: 15px !important;
            }
            body {
                overflow-x: hidden;
            }
        }
        @media (max-width: 480px) {
            .mobile-element-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        /* 加载提示 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            color: #aaccff;
            font-size: 18px;
        }
        #loading-screen .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333366;
            border-top-color: #6688cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>






  <script src="./assets/index-BPptkwVK.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>正在加载魔法世界...</div>
    </div>
    <div id="game-container"></div>

    <!-- 模块化入口 -->


    <!-- 全局错误捕获 -->
    <div id="debug-error" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ff0000;
        color: #fff;
        padding: 10px;
        font-size: 14px;
        z-index: 999999;
        display: none;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
    "></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.textContent = '错误: ' + msg + '\n位置: ' + url + ':' + line + ':' + col +
                    (error && error.stack ? '\n堆栈: ' + error.stack : '');
            }
            console.error('全局错误:', msg, url, line, col, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const debugDiv = document.getElementById('debug-error');
            if (debugDiv) {
                debugDiv.textContent += '\nPromise错误: ' + (event.reason && event.reason.message ? event.reason.message : event.reason);
                debugDiv.style.display = 'block';
            }
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
</html>
